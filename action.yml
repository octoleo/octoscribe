name: OctoScribe
description: >
  Imports audio from Telegram or a folder, transcribes it with one to three
  independent ASR providers, and preserves audio and transcript evidence in
  separate repositories. Prepare the repository paths first and configure
  authentication when their remotes require pull or push access.

inputs:
  telegram_api_id:
    description: 'Telegram API ID; required only for Telegram run/download'
    required: false
    default: ''
  telegram_api_hash:
    description: 'Telegram API hash; required only for Telegram run/download'
    required: false
    default: ''
  telegram_phone:
    description: 'Telegram phone number; required only for Telegram run/download'
    required: false
    default: ''
  telegram_session_b64:
    description: 'Base64 Telegram session; required only for non-interactive Telegram run/download'
    required: false
    default: ''
  telegram_group:
    description: 'Telegram group (@username or numeric ID); required only for Telegram run/download'
    required: false
    default: ''
  source:
    description: 'Audio source for run/download: telegram or folder'
    required: false
    default: 'telegram'
  source_folder:
    description: 'Existing audio folder; required when source=folder'
    required: false
    default: ''

  openai_api_key:
    description: 'OpenAI API key; enables the openai provider'
    required: false
    default: ''
  xai_api_key:
    description: 'xAI API key; enables the xai provider'
    required: false
    default: ''
  meta_asr_url:
    description: 'OpenAI-compatible endpoint serving a Meta ASR model'
    required: false
    default: ''
  meta_asr_api_key:
    description: 'Optional bearer token for the Meta ASR endpoint'
    required: false
    default: ''
  meta_asr_model:
    description: 'Model identifier exposed by the Meta ASR endpoint'
    required: false
    default: ''
  meta_asr_language:
    description: 'Meta Omnilingual language/script code, for example eng_Latn'
    required: false
    default: ''
  providers:
    description: 'Ordered ASR providers (one to three): openai,xai,meta,whisper'
    required: false
    default: ''
  primary_provider:
    description: 'Canonical provider; defaults to the first enabled provider'
    required: false
    default: ''

  audio_repo_path:
    description: 'Local path to the pre-cloned immutable-audio repository'
    required: false
    default: './audio-data'
  transcript_repo_path:
    description: 'Local path to the pre-cloned transcript/evidence repository'
    required: false
    default: './transcript-data'
  data_repo_path:
    description: 'Legacy shared repository path; used when split paths are omitted'
    required: false
    default: ''
  transcribe_backend:
    description: 'Legacy single-backend override: openai or local'
    required: false
    default: ''
  command:
    description: 'Pipeline command: run | download | transcribe | sync | status'
    required: false
    default: 'run'
  no_push:
    description: 'Set to "true" to skip the final git push'
    required: false
    default: 'false'
  config_path:
    description: 'Path to octoscribe.ini (optional; uses defaults if not set)'
    required: false
    default: ''
  verbose:
    description: 'Set to "true" to enable debug logging'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install ffmpeg
      if: ${{ inputs.command == 'run' || inputs.command == 'transcribe' }}
      shell: bash
      run: |
        set -euo pipefail
        if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
          ffmpeg -version
          exit 0
        fi

        if command -v apt-get >/dev/null 2>&1; then
          OCTOSCRIBE_SUDO=()
          if [ "$(id -u)" -ne 0 ]; then
            OCTOSCRIBE_SUDO=(sudo)
          fi
          "${OCTOSCRIBE_SUDO[@]}" apt-get update
          "${OCTOSCRIBE_SUDO[@]}" apt-get install -y ffmpeg
        elif command -v brew >/dev/null 2>&1; then
          brew install ffmpeg
        else
          echo 'ffmpeg and ffprobe are required for transcription.' >&2
          exit 1
        fi

    - name: Install OctoScribe dependencies
      shell: bash
      env:
        OCTOSCRIBE_ACTION_PATH: ${{ github.action_path }}
      run: python3 -m pip install -r "$OCTOSCRIBE_ACTION_PATH/requirements.txt"

    - name: Install optional local Whisper runtime
      shell: bash
      env:
        OCTOSCRIBE_ACTION_PATH: ${{ github.action_path }}
        INPUT_CONFIG_PATH: ${{ inputs.config_path }}
        INPUT_TRANSCRIBE_BACKEND: ${{ inputs.transcribe_backend }}
        INPUT_PROVIDERS: ${{ inputs.providers }}
      run: |
        set -euo pipefail
        LOCAL_REQUESTED="$(python3 - "$OCTOSCRIBE_ACTION_PATH" \
          "$INPUT_CONFIG_PATH" "$INPUT_TRANSCRIBE_BACKEND" \
          "$INPUT_PROVIDERS" <<'PY'
        import sys

        action_path, config_path, backend, providers = sys.argv[1:]
        sys.path.insert(0, action_path)

        from src.config import Config

        overrides = {}
        if backend:
            overrides["transcribe__backend"] = backend
        if providers:
            overrides["transcribe__providers"] = providers
        config = Config.load(
            ini_path=config_path or None,
            validation_profile="status",
            **overrides,
        )
        requested = (
            config.transcribe.backend.strip().lower() == "local"
            or "whisper" in config.transcribe.providers
        )
        print("true" if requested else "false")
        PY
        )"
        if [ "$LOCAL_REQUESTED" = 'true' ]; then
          python3 -m pip install -r "$OCTOSCRIBE_ACTION_PATH/requirements-local.txt"
        else
          echo 'Local Whisper is not enabled; skipping its optional runtime.'
        fi

    - name: Run OctoScribe
      shell: bash
      env:
        OCTOSCRIBE_ACTION_PATH: ${{ github.action_path }}
        INPUT_TELEGRAM_API_ID: ${{ inputs.telegram_api_id }}
        INPUT_TELEGRAM_API_HASH: ${{ inputs.telegram_api_hash }}
        INPUT_TELEGRAM_PHONE: ${{ inputs.telegram_phone }}
        INPUT_TELEGRAM_SESSION_B64: ${{ inputs.telegram_session_b64 }}
        INPUT_TELEGRAM_GROUP: ${{ inputs.telegram_group }}
        INPUT_SOURCE: ${{ inputs.source }}
        INPUT_SOURCE_FOLDER: ${{ inputs.source_folder }}
        OPENAI_API_KEY: ${{ inputs.openai_api_key }}
        XAI_API_KEY: ${{ inputs.xai_api_key }}
        META_ASR_URL: ${{ inputs.meta_asr_url }}
        META_ASR_API_KEY: ${{ inputs.meta_asr_api_key }}
        META_ASR_MODEL: ${{ inputs.meta_asr_model }}
        META_ASR_LANGUAGE: ${{ inputs.meta_asr_language }}
        INPUT_PROVIDERS: ${{ inputs.providers }}
        INPUT_PRIMARY_PROVIDER: ${{ inputs.primary_provider }}
        INPUT_AUDIO_REPO_PATH: ${{ inputs.audio_repo_path }}
        INPUT_TRANSCRIPT_REPO_PATH: ${{ inputs.transcript_repo_path }}
        INPUT_DATA_REPO_PATH: ${{ inputs.data_repo_path }}
        INPUT_TRANSCRIBE_BACKEND: ${{ inputs.transcribe_backend }}
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_NO_PUSH: ${{ inputs.no_push }}
        INPUT_CONFIG_PATH: ${{ inputs.config_path }}
        INPUT_VERBOSE: ${{ inputs.verbose }}
        TELEGRAM_API_ID: ${{ inputs.telegram_api_id }}
        TELEGRAM_API_HASH: ${{ inputs.telegram_api_hash }}
        TELEGRAM_PHONE: ${{ inputs.telegram_phone }}
      run: |
        set -euo pipefail

        case "$INPUT_COMMAND" in
          run|download|transcribe|sync|status) ;;
          *)
            echo "Unsupported OctoScribe command: $INPUT_COMMAND" >&2
            exit 2
            ;;
        esac
        case "$INPUT_SOURCE" in
          telegram|folder) ;;
          *)
            echo "Unsupported audio source: $INPUT_SOURCE" >&2
            exit 2
            ;;
        esac

        if { [ -n "$INPUT_AUDIO_REPO_PATH" ] && [ -z "$INPUT_TRANSCRIPT_REPO_PATH" ]; } || \
           { [ -z "$INPUT_AUDIO_REPO_PATH" ] && [ -n "$INPUT_TRANSCRIPT_REPO_PATH" ]; }; then
          echo 'audio_repo_path and transcript_repo_path must be supplied together.' >&2
          exit 2
        fi

        # Keep credentials and Telethon session databases out of every data
        # worktree, including repositories created by older OctoScribe releases.
        protect_evidence_repo() {
          local repo_path="$1"
          [ -n "$repo_path" ] || return 0
          git -C "$repo_path" rev-parse --is-inside-work-tree >/dev/null 2>&1 || return 0

          local tracked_sensitive
          tracked_sensitive="$(
            git -C "$repo_path" ls-files \
              | grep -E '(^|/)\.env($|\.)|(^|/)\.session(/|$)|\.session($|-)' \
              | grep -Ev '(^|/)\.env\.example$' \
              || true
          )"
          if [ -n "$tracked_sensitive" ]; then
            echo "Refusing to use $repo_path: secret/session paths are already tracked:" >&2
            printf '%s\n' "$tracked_sensitive" >&2
            exit 1
          fi

          local git_dir exclude_file marker
          git_dir="$(git -C "$repo_path" rev-parse --absolute-git-dir)"
          exclude_file="$git_dir/info/exclude"
          marker='# OctoScribe runtime secrets (managed by action)'
          mkdir -p "$git_dir/info"
          if ! grep -qxF "$marker" "$exclude_file" 2>/dev/null; then
            {
              printf '\n%s\n' "$marker"
              printf '%s\n' '.env' '.env.*' '!.env.example' '.session/' '*.session' '*.session-*'
            } >> "$exclude_file"
          fi
        }

        if [ -n "$INPUT_AUDIO_REPO_PATH" ]; then
          protect_evidence_repo "$INPUT_AUDIO_REPO_PATH"
          protect_evidence_repo "$INPUT_TRANSCRIPT_REPO_PATH"
        else
          protect_evidence_repo "$INPUT_DATA_REPO_PATH"
        fi

        CONFIG_PATH="$INPUT_CONFIG_PATH"
        USES_SOURCE=false
        if [ "$INPUT_COMMAND" = 'run' ] || [ "$INPUT_COMMAND" = 'download' ]; then
          USES_SOURCE=true
        fi

        if [ "$USES_SOURCE" = true ] && [ "$INPUT_SOURCE" = 'folder' ]; then
          if [ -z "$INPUT_SOURCE_FOLDER" ]; then
            echo 'source_folder is required when source=folder.' >&2
            exit 2
          fi
        fi

        OCTOSCRIBE_TEMP_DIR=''
        cleanup_octoscribe_runtime() {
          if [ -n "$OCTOSCRIBE_TEMP_DIR" ] && [ -d "$OCTOSCRIBE_TEMP_DIR" ]; then
            rm -f "$OCTOSCRIBE_TEMP_DIR/octoscribe.session" \
                  "$OCTOSCRIBE_TEMP_DIR/octoscribe.session-journal" \
                  "$OCTOSCRIBE_TEMP_DIR/octoscribe.session-wal" \
                  "$OCTOSCRIBE_TEMP_DIR/octoscribe.session-shm" \
                  "$OCTOSCRIBE_TEMP_DIR/octoscribe-runtime.ini"
            rmdir "$OCTOSCRIBE_TEMP_DIR" 2>/dev/null || true
          fi
        }
        trap cleanup_octoscribe_runtime EXIT

        if [ "$USES_SOURCE" = true ] && [ "$INPUT_SOURCE" = 'telegram' ]; then
          if [ -z "$INPUT_TELEGRAM_API_ID" ] || [ -z "$INPUT_TELEGRAM_API_HASH" ] || \
             [ -z "$INPUT_TELEGRAM_PHONE" ] || [ -z "$INPUT_TELEGRAM_SESSION_B64" ] || \
             [ -z "$INPUT_TELEGRAM_GROUP" ]; then
            echo 'Telegram credentials, session, and group are required for Telegram run/download.' >&2
            exit 2
          fi

          OCTOSCRIBE_TEMP_ROOT="${RUNNER_TEMP:-${TMPDIR:-/tmp}}"
          OCTOSCRIBE_TEMP_DIR="$(mktemp -d "$OCTOSCRIBE_TEMP_ROOT/octoscribe-session.XXXXXX")"
          chmod 700 "$OCTOSCRIBE_TEMP_DIR"

          OCTOSCRIBE_SESSION_B64="$INPUT_TELEGRAM_SESSION_B64" \
            python3 - "$OCTOSCRIBE_TEMP_DIR/octoscribe.session" <<'PY'
        import base64
        import os
        import sys
        from pathlib import Path

        destination = Path(sys.argv[1])
        encoded = "".join(os.environ["OCTOSCRIBE_SESSION_B64"].split())
        try:
            payload = base64.b64decode(encoded, validate=True)
        except Exception as exc:
            raise SystemExit(f"Invalid telegram_session_b64: {exc}") from exc
        if not payload:
            raise SystemExit("telegram_session_b64 decoded to an empty session")
        destination.write_bytes(payload)
        destination.chmod(0o600)
        PY

          python3 - "$INPUT_CONFIG_PATH" \
            "$OCTOSCRIBE_TEMP_DIR/octoscribe-runtime.ini" \
            "$OCTOSCRIBE_TEMP_DIR" <<'PY'
        import configparser
        import sys
        from pathlib import Path

        source, destination, session_dir = sys.argv[1:]
        config = configparser.ConfigParser(interpolation=None)
        if source:
            source_path = Path(source)
            if not source_path.is_file():
                raise SystemExit(f"Config file does not exist: {source_path}")
            with source_path.open(encoding="utf-8") as handle:
                config.read_file(handle)
        if not config.has_section("paths"):
            config.add_section("paths")
        config.set("paths", "session_dir", session_dir)
        with Path(destination).open("w", encoding="utf-8") as handle:
            config.write(handle)
        PY
          CONFIG_PATH="$OCTOSCRIBE_TEMP_DIR/octoscribe-runtime.ini"
        fi

        # Never expose or forward the encoded session after the explicit,
        # temporary decode above.
        unset INPUT_TELEGRAM_SESSION_B64 TELEGRAM_SESSION_B64

        CMD=(python3 "$OCTOSCRIBE_ACTION_PATH/octoscribe.py")
        if [ -n "$CONFIG_PATH" ]; then
          CMD+=(--config "$CONFIG_PATH")
        fi
        if [ "$INPUT_VERBOSE" = 'true' ]; then
          CMD+=(--verbose)
        fi
        if [ -n "$INPUT_AUDIO_REPO_PATH" ]; then
          CMD+=(--audio-repo "$INPUT_AUDIO_REPO_PATH")
          CMD+=(--transcript-repo "$INPUT_TRANSCRIPT_REPO_PATH")
        else
          CMD+=(--data-repo "$INPUT_DATA_REPO_PATH")
        fi

        CMD+=("$INPUT_COMMAND")
        if [ "$USES_SOURCE" = true ]; then
          CMD+=(--source "$INPUT_SOURCE")
          if [ "$INPUT_SOURCE" = 'folder' ]; then
            CMD+=(--folder "$INPUT_SOURCE_FOLDER")
          else
            CMD+=(--group "$INPUT_TELEGRAM_GROUP")
          fi
        fi
        if [ "$INPUT_COMMAND" = 'run' ] || [ "$INPUT_COMMAND" = 'transcribe' ]; then
          if [ -n "$INPUT_PROVIDERS" ]; then
            CMD+=(--providers "$INPUT_PROVIDERS")
          elif [ -n "$INPUT_TRANSCRIBE_BACKEND" ]; then
            CMD+=(--backend "$INPUT_TRANSCRIBE_BACKEND")
          fi
          if [ -n "$INPUT_PRIMARY_PROVIDER" ]; then
            CMD+=(--primary-provider "$INPUT_PRIMARY_PROVIDER")
          fi
        fi
        if [ "$INPUT_NO_PUSH" = 'true' ] && [ "$INPUT_COMMAND" = 'run' ]; then
          CMD+=(--no-push)
        fi

        printf 'Running:'
        printf ' %q' "${CMD[@]}"
        printf '\n'
        "${CMD[@]}"
