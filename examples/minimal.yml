# Minimal OctoScribe workflow
#
# Put source recordings in ./audio. OctoScribe uses its default paths:
# ./audio, ./transcriptions, and ./manifest.json. The artifact keeps this
# minimal run's output; use in-repository.yml or full.yml when the caller
# should commit results to a repository.
name: Transcribe sermon audio (minimal)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out audio
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Transcribe audio
        uses: octoleo/octoscribe@v1
        with:
          command: transcribe
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}

      - name: Preserve transcript and manifest
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: octoscribe-output
          if-no-files-found: error
          path: |
            transcriptions/
            manifest.json
