# Complete in-repository OctoScribe workflow
#
# Copy this file to .github/workflows/octoscribe.yml in the repository that
# already owns the audio and transcripts. The checked-out repository itself is
# the shared OctoScribe workspace:
#
#   audio/             preserved source recordings
#   manifest.json      persistent index and skip state
#   transcriptions/    authoritative machine transcripts
#   candidates/        raw provider responses
#   reports/           comparison and provenance evidence
#
# OctoScribe performs no Git operations. The caller steps below use the
# workflow's built-in GITHUB_TOKEN and github-actions bot identity.
name: Transcribe sermon audio in this repository

on:
  workflow_dispatch:
    inputs:
      source_mode:
        description: 'Audio source'
        required: true
        default: telegram
        type: choice
        options:
          - telegram
          - folder
      source_folder:
        description: 'Prepared folder path when source_mode=folder'
        required: false
        default: './incoming-audio'
        type: string
      providers:
        description: 'Ordered providers; blank discovers configured credentials'
        required: false
        default: ''
        type: string
      primary_provider:
        description: 'Canonical provider; blank uses first enabled provider'
        required: false
        default: ''
        type: string
      verbose:
        description: 'Enable debug-level OctoScribe logs'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: write

concurrency:
  group: octoscribe-in-repository-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  transcribe:
    name: Acquire, checkpoint, and transcribe here
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SOURCE_MODE: ${{ inputs.source_mode || vars.SOURCE_MODE || 'telegram' }}
      SOURCE_FOLDER: ${{ inputs.source_folder || vars.SOURCE_FOLDER || './incoming-audio' }}
      PROVIDERS: ${{ inputs.providers || vars.OCTOSCRIBE_ASR_PROVIDERS || '' }}
      PRIMARY_PROVIDER: ${{ inputs.primary_provider || vars.OCTOSCRIBE_PRIMARY_ASR || '' }}
      VERBOSE: ${{ inputs.verbose || vars.OCTOSCRIBE_VERBOSE || 'false' }}

    steps:
      - name: Validate selected source
        shell: bash
        run: |
          set -euo pipefail
          case "$SOURCE_MODE" in
            telegram|folder) ;;
            *) echo 'SOURCE_MODE must be telegram or folder' >&2; exit 2 ;;
          esac

      # actions/checkout persists GITHUB_TOKEN for the caller-owned commits.
      - name: Check out this evidence repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure GitHub Actions commit identity
        shell: bash
        run: |
          set -euo pipefail
          /bin/git config user.name 'github-actions[bot]'
          /bin/git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          echo "Evidence repository: ${GITHUB_REPOSITORY}@${GITHUB_REF_NAME}"

      - name: Validate prepared folder source
        if: ${{ env.SOURCE_MODE == 'folder' }}
        shell: bash
        run: |
          set -euo pipefail
          test -d "$SOURCE_FOLDER"

      # Save completed downloads even if a later Telegram item fails. This
      # protects work from the runner's ephemeral filesystem.
      - name: Download or import audio into this repository
        id: acquire
        continue-on-error: true
        uses: octoleo/octoscribe@v1
        with:
          command: download
          source: ${{ env.SOURCE_MODE }}
          source_folder: ${{ env.SOURCE_FOLDER }}
          telegram_api_id: ${{ secrets.TELEGRAM_API_ID }}
          telegram_api_hash: ${{ secrets.TELEGRAM_API_HASH }}
          telegram_phone: ${{ secrets.TELEGRAM_PHONE }}
          telegram_session_b64: ${{ secrets.TELEGRAM_SESSION_B64 }}
          telegram_group: ${{ vars.TELEGRAM_GROUP }}
          data_repo_path: .
          config_path: ${{ vars.OCTOSCRIBE_CONFIG_PATH || '' }}
          verbose: ${{ env.VERBOSE }}

      - name: Publish audio and index checkpoint
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if /bin/git status --porcelain --untracked-files=no -- audio | grep -q .; then
            echo 'Refusing to modify or delete committed source audio.' >&2
            exit 1
          fi
          STAGED=()
          [ -e ./audio ] && STAGED+=(audio)
          [ -e ./manifest.json ] && STAGED+=(manifest.json)
          if [ "${#STAGED[@]}" -gt 0 ]; then
            /bin/git add --all -- "${STAGED[@]}"
          fi
          if ! /bin/git diff --cached --quiet; then
            /bin/git commit -m 'Checkpoint acquired sermon audio and index'
          fi
          /bin/git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Capture exact audio provenance
        id: audio
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          REVISION="$(/bin/git rev-parse HEAD)"
          test -n "$REVISION" && test -n "$GITHUB_REF_NAME"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "branch=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          echo "Audio provenance: branch=$GITHUB_REF_NAME revision=$REVISION"

      - name: Stop after persisting an acquisition failure
        if: ${{ steps.acquire.outcome != 'success' }}
        shell: bash
        run: |
          echo 'OctoScribe acquisition failed; completed audio/index changes were persisted.' >&2
          exit 1

      - name: Transcribe committed audio in this repository
        id: transcribe
        continue-on-error: true
        uses: octoleo/octoscribe@v1
        with:
          command: transcribe
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          xai_api_key: ${{ secrets.XAI_API_KEY }}
          xai_base_url: ${{ vars.XAI_BASE_URL || 'https://api.x.ai/v1/stt' }}
          meta_asr_url: ${{ vars.META_ASR_URL }}
          meta_asr_api_key: ${{ secrets.META_ASR_API_KEY }}
          meta_asr_model: ${{ vars.META_ASR_MODEL || 'omniASR_LLM_Unlimited_7B_v2' }}
          meta_asr_language: ${{ vars.META_ASR_LANGUAGE || 'eng_Latn' }}
          providers: ${{ env.PROVIDERS }}
          primary_provider: ${{ env.PRIMARY_PROVIDER }}
          transcribe_model: ${{ vars.TRANSCRIBE_MODEL || 'gpt-transcribe' }}
          transcribe_language: ${{ vars.TRANSCRIBE_LANGUAGE || 'en' }}
          local_model: ${{ vars.LOCAL_MODEL || 'large-v3' }}
          local_device: ${{ vars.LOCAL_DEVICE || 'cpu' }}
          local_compute_type: ${{ vars.LOCAL_COMPUTE_TYPE || 'int8' }}
          data_repo_path: .
          audio_revision: ${{ steps.audio.outputs.revision }}
          audio_repository_branch: ${{ steps.audio.outputs.branch }}
          config_path: ${{ vars.OCTOSCRIBE_CONFIG_PATH || '' }}
          verbose: ${{ env.VERBOSE }}

      # Persist raw candidates and failure reports as well as successful text.
      - name: Publish transcript, evidence, and updated index
        if: ${{ always() && steps.acquire.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          if /bin/git status --porcelain --untracked-files=no -- \
              transcriptions candidates reports | grep -q .; then
            echo 'Refusing to modify or delete committed transcript evidence.' >&2
            exit 1
          fi
          STAGED=()
          for PATHSPEC in manifest.json transcriptions candidates reports; do
            [ -e "./$PATHSPEC" ] && STAGED+=("$PATHSPEC")
          done
          if [ "${#STAGED[@]}" -gt 0 ]; then
            /bin/git add --all -- "${STAGED[@]}"
          fi
          if ! /bin/git diff --cached --quiet; then
            /bin/git commit -m 'Add OctoScribe transcript evidence'
          fi
          /bin/git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Propagate transcription result
        if: ${{ always() && steps.acquire.outcome == 'success' }}
        env:
          TRANSCRIBE_OUTCOME: ${{ steps.transcribe.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$TRANSCRIBE_OUTCOME" != success ]; then
            echo 'OctoScribe transcription failed; available evidence was persisted.' >&2
            exit 1
          fi
          echo 'OctoScribe transcription and evidence publication completed.'
