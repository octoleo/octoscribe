name: OctoScribe Pipeline

on:
  schedule:
    # Run every Monday at 06:00 UTC — adjust to your timezone
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      command:
        description: 'Pipeline command to run'
        required: false
        default: 'run'
        type: choice
        options:
          - run
          - download
          - transcribe
          - sync
          - status
      no_push:
        description: 'Skip git push (dry-run mode)'
        required: false
        default: false
        type: boolean
      verbose:
        description: 'Enable verbose/debug logging'
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Run Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout OctoScribe
        uses: actions/checkout@v4

      - name: Setup GitHub User Details
        uses: octoleo/git-user@v2
        with:
          gpg-key:   ${{ secrets.GPG_KEY }}
          gpg-user:  ${{ secrets.GPG_USER }}
          ssh-key:   ${{ secrets.SSH_KEY }}
          ssh-pub:   ${{ secrets.SSH_PUB }}
          git-user:  ${{ secrets.GIT_USER }}
          git-email: ${{ secrets.GIT_EMAIL }}

      - name: Clone Data Repository
        run: |
          /bin/git clone git@github.com:${{ vars.DATA_REPO_ORG }}/${{ vars.DATA_REPO_NAME }}.git ./data

      - name: Run OctoScribe
        uses: ./
        with:
          telegram_api_id:      ${{ secrets.TELEGRAM_API_ID }}
          telegram_api_hash:    ${{ secrets.TELEGRAM_API_HASH }}
          telegram_phone:       ${{ secrets.TELEGRAM_PHONE }}
          telegram_session_b64: ${{ secrets.TELEGRAM_SESSION_B64 }}
          telegram_group:       ${{ vars.TELEGRAM_GROUP }}
          openai_api_key:       ${{ secrets.OPENAI_API_KEY }}
          data_repo_path:       ./data
          transcribe_backend:   ${{ vars.TRANSCRIBE_BACKEND || 'openai' }}
          command:              ${{ github.event.inputs.command || 'run' }}
          no_push:              ${{ github.event.inputs.no_push || 'false' }}
          verbose:              ${{ github.event.inputs.verbose || 'false' }}
