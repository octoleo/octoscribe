name: PR validation bridge

on:
  check_suite:
    types: [requested, rerequested]

permissions:
  contents: read

jobs:
  validate:
    if: >-
      github.event.check_suite.app.slug == 'claude' &&
      github.event.check_suite.head_branch == 'feature/verbatim-ensemble-transcription'
    uses: octoleo/octoscribe/.github/workflows/ci.yml@feature/verbatim-ensemble-transcription
